version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "database"
        out: "../internal/database"
        sql_package: "pgx/v5"
        output_db_file_name: "db.gen.go"
        output_models_file_name: "models.gen.go"
        emit_json_tags: true
        emit_empty_slices: true
